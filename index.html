<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Database Carte Premodern - MTG</title>
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#c9a227">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Premodern DB">
<link rel="apple-touch-icon" href="icon-192.png">
<style>
  :root {
    --bg: #1a1a1d;
    --panel: #26262b;
    --panel2: #2f2f36;
    --border: #3a3a42;
    --text: #e8e8ea;
    --muted: #9a9aa5;
    --accent: #c9a227;
    --accent2: #e0b84a;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: -apple-system, Segoe UI, Roboto, Arial, sans-serif;
    background: var(--bg);
    color: var(--text);
    font-size: 14px;
  }
  header {
    background: linear-gradient(180deg, #2b2b31, #1f1f24);
    border-bottom: 2px solid var(--accent);
    padding: 14px 20px;
    position: sticky;
    top: 0;
    z-index: 50;
  }
  header h1 { margin: 0 0 2px; font-size: 20px; letter-spacing: .3px; }
  header .sub { color: var(--muted); font-size: 12px; }
  .controls {
    display: flex;
    flex-wrap: wrap;
    gap: 10px;
    padding: 14px 20px;
    background: var(--panel);
    border-bottom: 1px solid var(--border);
    position: sticky;
    top: 60px;
    z-index: 40;
  }
  .ctrl { display: flex; flex-direction: column; gap: 3px; }
  .ctrl label { font-size: 11px; color: var(--muted); text-transform: uppercase; letter-spacing: .5px; }
  input[type="text"], select {
    background: var(--panel2);
    color: var(--text);
    border: 1px solid var(--border);
    border-radius: 5px;
    padding: 7px 9px;
    font-size: 13px;
    outline: none;
  }
  input[type="text"]:focus, select:focus { border-color: var(--accent); }
  #q { min-width: 260px; }
  .colors { display: flex; gap: 4px; align-items: center; }
  .cbtn {
    width: 30px; height: 30px; border-radius: 50%;
    border: 2px solid var(--border); cursor: pointer;
    font-weight: bold; display: flex; align-items: center; justify-content: center;
    user-select: none; font-size: 13px;
  }
  .cbtn.active { border-color: var(--accent2); box-shadow: 0 0 0 2px var(--accent2); }
  .c-W { background: #f8f6d8; color: #333; }
  .c-U { background: #aae0fa; color: #0a3b5c; }
  .c-B { background: #cbc2bf; color: #1a1a1a; }
  .c-R { background: #f9aa8f; color: #5c1a0a; }
  .c-G { background: #9bd3ae; color: #0a3b1a; }
  .c-C { background: #ccc2c0; color: #333; }
  .btn {
    background: var(--accent); color: #1a1a1d; border: none;
    border-radius: 5px; padding: 8px 14px; cursor: pointer; font-weight: 600;
    align-self: flex-end;
  }
  .btn.secondary { background: var(--panel2); color: var(--text); border: 1px solid var(--border); }
  .count { padding: 10px 20px; color: var(--muted); font-size: 13px; }
  .grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(240px, 1fr));
    gap: 14px;
    padding: 0 20px 40px;
  }
  .card {
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 8px;
    overflow: hidden;
    display: flex;
    flex-direction: column;
  }
  .card .imgwrap {
    background: #111;
    aspect-ratio: 488 / 680;
    display: flex; align-items: center; justify-content: center;
    overflow: hidden;
  }
  .card .imgwrap img { width: 100%; height: 100%; object-fit: cover; display: block; }
  .card .imgwrap .noimg { color: var(--muted); font-size: 12px; padding: 20px; text-align: center; }
  .card .body { padding: 10px 12px; display: flex; flex-direction: column; gap: 6px; }
  .card .nm { font-weight: 700; font-size: 15px; line-height: 1.2; }
  .card .nm_it { color: var(--accent2); font-size: 12px; font-style: italic; }
  .card .meta { color: var(--muted); font-size: 12px; }
  .card .typeline { font-size: 12px; color: #cfcfd6; }
  .card .pt { font-weight: 700; color: var(--accent2); }
  .card .rules { font-size: 12px; line-height: 1.35; white-space: pre-wrap; color: #d6d6dc; }
  .card .rules_it { font-size: 12px; line-height: 1.35; white-space: pre-wrap; color: #b9c4b0; border-top: 1px dashed var(--border); padding-top: 5px; }
  .pill {
    display: inline-block; font-size: 10px; text-transform: uppercase;
    letter-spacing: .4px; padding: 2px 6px; border-radius: 4px;
    background: var(--panel2); color: var(--muted); border: 1px solid var(--border);
  }
  .pill.rare { color: #e0b84a; border-color: #6a5a1a; }
  .pill.uncommon { color: #cfd6e0; border-color: #4a5566; }
  .pill.common { color: #cfcfd6; }
  .mana { font-weight: 600; }
  .loading { padding: 40px 20px; font-size: 15px; }
  .toggle-it { font-size: 12px; color: var(--muted); display: flex; align-items: center; gap: 5px; align-self: flex-end; cursor: pointer; }
  a.srclink { color: var(--accent2); font-size: 11px; text-decoration: none; }
  a.srclink:hover { text-decoration: underline; }
  mark { background: var(--accent2); color: #1a1a1d; padding: 0 1px; border-radius: 2px; }

  /* Pannello filtri richiudibile */
  header { display: flex; align-items: center; justify-content: space-between; gap: 12px; }
  .filters-btn {
    background: var(--accent); color: #1a1a1d; border: none; border-radius: 5px;
    padding: 8px 14px; cursor: pointer; font-weight: 700; font-size: 13px; white-space: nowrap;
  }
  .filters-btn .badge {
    display: inline-block; min-width: 18px; padding: 0 5px; margin-left: 4px;
    border-radius: 9px; background: #1a1a1d; color: var(--accent2); font-size: 11px;
  }
  .controls.collapsed { display: none; }
  .controls.opening { animation: slideDown .2s ease-out; }
  @keyframes slideDown { from { opacity: 0; transform: translateY(-12px); } to { opacity: 1; transform: none; } }
  @media (prefers-reduced-motion: reduce) { .controls.opening { animation: none; } }

  /* Carta cliccabile + stella preferiti */
  .card { position: relative; cursor: pointer; }
  .card:focus-visible { outline: 2px solid var(--accent2); outline-offset: 2px; }
  .fav {
    position: absolute; top: 6px; right: 6px; z-index: 2;
    width: 34px; height: 34px; border-radius: 50%;
    background: rgba(0, 0, 0, .65); color: #cfcfd6;
    border: 1px solid var(--border); font-size: 19px; line-height: 1;
    cursor: pointer; display: flex; align-items: center; justify-content: center;
  }
  .fav.on { color: var(--accent2); border-color: var(--accent2); }
  .fav:focus-visible { outline: 2px solid var(--accent2); }
  .pill.banned { color: #fff; background: #a3262a; border-color: #d04040; }
  .toggle-fav { font-size: 12px; color: var(--muted); display: flex; align-items: center; gap: 5px; align-self: flex-end; cursor: pointer; }

  /* Vista ingrandita (finestra) */
  .modal-bg {
    position: fixed; inset: 0; z-index: 100; background: rgba(0, 0, 0, .78);
    display: none; align-items: center; justify-content: center; padding: 16px;
  }
  .modal-bg.open { display: flex; }
  .modal {
    position: relative; background: var(--panel); border: 1px solid var(--border);
    border-radius: 10px; width: 100%; max-width: 920px; max-height: 92vh; overflow: auto;
    display: flex; gap: 18px; padding: 18px;
  }
  .modal .mimg { flex: 0 0 340px; }
  .modal .mimg img { width: 100%; border-radius: 14px; display: block; }
  .modal .minfo { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 8px; padding-right: 28px; }
  .modal h2 { margin: 0; font-size: 20px; }
  .modal .sec { font-size: 11px; color: var(--muted); text-transform: uppercase; letter-spacing: .5px; margin-top: 6px; }
  .mclose {
    position: absolute; top: 8px; right: 8px; width: 34px; height: 34px; border-radius: 50%;
    background: var(--panel2); color: var(--text); border: 1px solid var(--border);
    font-size: 18px; cursor: pointer;
  }
  .prints { display: flex; flex-wrap: wrap; gap: 5px; }
  .prints button {
    background: var(--panel2); color: var(--text); border: 1px solid var(--border);
    border-radius: 4px; padding: 3px 7px; font-size: 11px; cursor: pointer;
  }
  .prints button.cur { border-color: var(--accent2); color: var(--accent2); }
  .price-box { background: var(--panel2); border: 1px solid var(--border); border-radius: 6px; padding: 8px 10px; font-size: 13px; line-height: 1.6; }
  .price-box .note { color: var(--muted); font-size: 11px; }
  .modal-actions { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
  .modal-actions a { color: var(--accent2); font-size: 12px; }
  body.noscroll { overflow: hidden; }
  @media (max-width: 720px) {
    .modal { flex-direction: column; }
    .modal .mimg { flex: none; width: 100%; max-width: 340px; margin: 0 auto; }
    .modal .minfo { padding-right: 0; }
  }
</style>
</head>
<body>
<header>
  <div>
    <h1>Database Carte Premodern</h1>
    <div class="sub">Alpha &rarr; Scourge + Unglued + Portal/Starter &bull; terre base escluse &bull; ogni carta una sola volta</div>
  </div>
  <button class="filters-btn" id="toggleFilters" aria-controls="controls" aria-expanded="true">
    Nascondi filtri &#9650;
  </button>
</header>

<div class="controls" id="controls">
  <div class="ctrl">
    <label>Ricerca (nome o testo)</label>
    <input type="text" id="q" placeholder="es. flying, goblin, trample, Shivan...">
  </div>
  <div class="ctrl">
    <label>Cerca in</label>
    <select id="scope">
      <option value="all">Nome + Testo</option>
      <option value="name">Solo nome</option>
      <option value="text">Solo testo</option>
    </select>
  </div>
  <div class="ctrl">
    <label>Tipo</label>
    <select id="fType"><option value="">(tutti)</option></select>
  </div>
  <div class="ctrl">
    <label>Sottotipo</label>
    <select id="fSub"><option value="">(tutti)</option></select>
  </div>
  <div class="ctrl">
    <label>Rarit&agrave;</label>
    <select id="fRar">
      <option value="">(tutte)</option>
      <option value="common">Comune</option>
      <option value="uncommon">Non comune</option>
      <option value="rare">Rara</option>
    </select>
  </div>
  <div class="ctrl">
    <label>Supertipo</label>
    <select id="fSuper"><option value="">(tutti)</option></select>
  </div>
  <div class="ctrl">
    <label>Costo (CMC)</label>
    <select id="fCmc">
      <option value="">(tutti)</option>
      <option value="0">0</option>
      <option value="1">1</option>
      <option value="2">2</option>
      <option value="3">3</option>
      <option value="4">4</option>
      <option value="5">5</option>
      <option value="6">6</option>
      <option value="7">7 o pi&ugrave;</option>
    </select>
  </div>
  <div class="ctrl">
    <label>Set</label>
    <select id="fSet"><option value="">(tutti)</option></select>
  </div>
  <div class="ctrl">
    <label>Legalit&agrave;</label>
    <select id="fLegal">
      <option value="">(tutte)</option>
      <option value="legal">Solo legali</option>
      <option value="banned">Solo bandite</option>
    </select>
  </div>
  <div class="ctrl">
    <label>Ordina per</label>
    <select id="sortBy">
      <option value="name">Nome</option>
      <option value="cmc">Costo (crescente)</option>
      <option value="cmc_desc">Costo (decrescente)</option>
      <option value="color">Colore</option>
      <option value="rarity">Rarit&agrave; (rare prima)</option>
      <option value="set">Set (data di uscita)</option>
    </select>
  </div>
  <div class="ctrl">
    <label>Carte mostrate</label>
    <select id="fLimit">
      <option value="200">200</option>
      <option value="600" selected>600</option>
      <option value="all">Tutte</option>
    </select>
  </div>
  <div class="ctrl">
    <label>Colore</label>
    <div class="colors" id="colors">
      <div class="cbtn c-W" data-c="W" title="Bianco">W</div>
      <div class="cbtn c-U" data-c="U" title="Blu">U</div>
      <div class="cbtn c-B" data-c="B" title="Nero">B</div>
      <div class="cbtn c-R" data-c="R" title="Rosso">R</div>
      <div class="cbtn c-G" data-c="G" title="Verde">G</div>
      <div class="cbtn c-C" data-c="C" title="Incolore">C</div>
    </div>
  </div>
  <div class="ctrl">
    <label>Modo colore</label>
    <select id="colorMode">
      <option value="any">Almeno uno</option>
      <option value="exact">Esatto</option>
      <option value="only">Solo questi</option>
    </select>
  </div>
  <button class="btn secondary" id="reset">Azzera filtri</button>
  <label class="toggle-it"><input type="checkbox" id="showIt" checked> Mostra italiano</label>
  <label class="toggle-fav"><input type="checkbox" id="onlyFav"> Solo preferiti &#9733;</label>
  <button class="btn" id="closeFilters">Mostra le carte &#9650;</button>
</div>

<div class="count" id="count">Caricamento...</div>
<div class="grid" id="grid"></div>
<div class="loading" id="loading">Caricamento del database...</div>

<!-- Vista ingrandita della carta -->
<div class="modal-bg" id="modalBg">
  <div class="modal" role="dialog" aria-modal="true" aria-labelledby="mName">
    <button class="mclose" id="mClose" aria-label="Chiudi">&times;</button>
    <div class="mimg"><img id="mImg" alt=""></div>
    <div class="minfo">
      <h2 id="mName"></h2>
      <div class="nm_it" id="mNameIt"></div>
      <div class="meta" id="mMeta"></div>
      <div class="typeline" id="mType"></div>
      <div class="rules" id="mText"></div>
      <div class="rules_it" id="mTextIt"></div>
      <div class="sec">Prezzo attuale (stampa selezionata)</div>
      <div class="price-box" id="mPrice"></div>
      <div class="sec" id="mPrintsTitle">Stampe</div>
      <div class="prints" id="mPrints"></div>
      <div class="modal-actions">
        <button class="btn secondary" id="mFav"></button>
        <a id="mScry" target="_blank" rel="noopener">Scryfall &#8599;</a>
        <a id="mCm" target="_blank" rel="noopener">Cardmarket &#8599;</a>
      </div>
    </div>
  </div>
</div>

<script>
let ALL = [];
let colorFilter = new Set();

// Nomi dei set (codici Scryfall) in ordine di uscita.
// Il set di ogni carta e' ricavato da url_scryfall (es. /card/tmp/107/...).
const SET_NAMES = [
  ['lea', 'Limited Edition Alpha'], ['leb', 'Limited Edition Beta'],
  ['2ed', 'Unlimited Edition'], ['arn', 'Arabian Nights'], ['atq', 'Antiquities'],
  ['3ed', 'Revised Edition'], ['leg', 'Legends'], ['drk', 'The Dark'],
  ['fem', 'Fallen Empires'], ['4ed', 'Fourth Edition'], ['ice', 'Ice Age'],
  ['chr', 'Chronicles'], ['hml', 'Homelands'], ['all', 'Alliances'],
  ['mir', 'Mirage'], ['vis', 'Visions'], ['5ed', 'Fifth Edition'],
  ['por', 'Portal'], ['wth', 'Weatherlight'], ['tmp', 'Tempest'],
  ['sth', 'Stronghold'], ['p02', 'Portal Second Age'], ['exo', 'Exodus'],
  ['ugl', 'Unglued'], ['usg', "Urza's Saga"], ['ulg', "Urza's Legacy"],
  ['6ed', 'Classic Sixth Edition'], ['ptk', 'Portal Three Kingdoms'],
  ['uds', "Urza's Destiny"], ['s99', 'Starter 1999'], ['mmq', 'Mercadian Masques'],
  ['nem', 'Nemesis'], ['s00', 'Starter 2000'], ['pcy', 'Prophecy'],
  ['inv', 'Invasion'], ['pls', 'Planeshift'], ['7ed', 'Seventh Edition'],
  ['apc', 'Apocalypse'], ['ody', 'Odyssey'], ['tor', 'Torment'],
  ['jud', 'Judgment'], ['ons', 'Onslaught'], ['lgn', 'Legions'], ['scg', 'Scourge'],
];
const SET_NAME = Object.fromEntries(SET_NAMES);
const SET_ORDER = Object.fromEntries(SET_NAMES.map(([code], i) => [code, i]));

const RARITY_IT = { common: 'comune', uncommon: 'non comune', rare: 'rara', special: 'speciale' };
const RARITY_RANK = { rare: 0, special: 1, uncommon: 2, common: 3 };
const SUPER_IT = { Legendary: 'Leggendario', World: 'Mondiale', Snow: 'Neve', Basic: 'Base' };

// Lista bandite Premodern (fonte: premodernmagic.com / Scryfall, aggiornata a gennaio 2026,
// ultima modifica: Parallax Tide). Da aggiornare a mano se la lista cambia.
const BANNED = new Set([
  'Amulet of Quoz', 'Balance', 'Brainstorm', 'Bronze Tablet', 'Channel',
  'Demonic Consultation', 'Earthcraft', 'Entomb', 'Flash', 'Force of Will',
  'Goblin Recruiter', 'Grim Monolith', 'Jeweled Bird', 'Land Tax', 'Mana Vault',
  'Memory Jar', "Mind's Desire", 'Mind Twist', 'Mystical Tutor', 'Necropotence',
  'Parallax Tide', 'Rebirth', 'Strip Mine', 'Tempest Efreet', 'Tendrils of Agony',
  'Time Spiral', 'Timmerian Fiends', 'Tolarian Academy', 'Vampiric Tutor', 'Windfall',
  'Worldgorger Dragon', "Yawgmoth's Bargain", "Yawgmoth's Will",
]);

// Preferiti: salvati nel browser (per nome carta).
const FAV_KEY = 'premodern-preferiti';
let FAV = new Set();
try { FAV = new Set(JSON.parse(localStorage.getItem(FAV_KEY) || '[]')); } catch { FAV = new Set(); }
function saveFav() {
  try { localStorage.setItem(FAV_KEY, JSON.stringify([...FAV])); } catch { /* spazio pieno o bloccato */ }
}
function toggleFav(name) {
  if (FAV.has(name)) FAV.delete(name); else FAV.add(name);
  saveFav();
}

function setCodeOf(card) {
  const m = /\/card\/([^/]+)\//.exec(card.url_scryfall || '');
  return m ? m[1].toLowerCase() : '';
}
function collectorOf(url) {
  const m = /\/card\/[^/]+\/([^/]+)\//.exec(url || '');
  return m ? decodeURIComponent(m[1]) : '';
}
function setLabel(code) {
  return (SET_NAME[code] || code.toUpperCase()) + ' (' + code.toUpperCase() + ')';
}

const el = id => document.getElementById(id);

async function load() {
  try {
    const res = await fetch('premodern_cards.json');
    if (!res.ok) throw new Error('HTTP ' + res.status);
    ALL = await res.json();
  } catch (e) {
    el('loading').textContent =
      'Impossibile caricare premodern_cards.json. ' +
      'Apri questo file dalla stessa cartella del JSON. Dettaglio: ' + e.message;
    return;
  }
  // Stampe di ogni carta in tutti i set (file opzionale: senza, si usa solo la stampa base).
  let stampe = {};
  try {
    const res2 = await fetch('premodern_stampe.json');
    if (res2.ok) stampe = await res2.json();
  } catch (e) { /* si continua con la sola stampa base */ }

  el('loading').style.display = 'none';
  for (const c of ALL) {
    c.set = setCodeOf(c);
    // set -> lista di stampe { set, rarita, url_scryfall, url_immagine, numero }
    // (piu' voci nello stesso set = varianti, es. Fallen Empires, Homelands)
    c.stampe = new Map();
    const add = p => {
      if (!c.stampe.has(p.set)) c.stampe.set(p.set, []);
      c.stampe.get(p.set).push(p);
    };
    const lista = stampe[c.nome] || [];
    for (const [set, rarita, url_scryfall, url_immagine, numero] of lista) {
      add({ set, rarita, url_scryfall, url_immagine, numero: numero || '' });
    }
    // Stampa base: aggiunta solo se il file delle stampe non la contiene gia'.
    const baseUrl = (c.url_scryfall || '').split('?')[0];
    if (c.set && !lista.some(p => p[2] === baseUrl)) {
      add({ set: c.set, rarita: c.rarita, url_scryfall: c.url_scryfall,
        url_immagine: c.url_immagine, numero: collectorOf(c.url_scryfall) });
    }
    // Stampa mostrata nella vista normale (quella del database).
    const delSet = c.stampe.get(c.set) || [];
    c.stampa = delSet.find(p => (p.url_scryfall || '').split('?')[0] === baseUrl) || delSet[0] || null;
    c.bandita = BANNED.has(c.nome);
  }
  buildTypeFilters();
  buildSetFilter();
  bindEvents();
  bindFiltersPanel();
  bindModal();
  render();
}

function buildTypeFilters() {
  const types = new Set();
  const subs = new Set();
  for (const c of ALL) {
    (c.tipo || '').split(' ').forEach(t => { if (t && t !== '//') types.add(t); });
    (c.sottotipo || '').split(' ').forEach(s => { if (s) subs.add(s); });
  }
  const tSel = el('fType');
  [...types].sort().forEach(t => {
    const o = document.createElement('option'); o.value = t; o.textContent = t; tSel.appendChild(o);
  });
  const sSel = el('fSub');
  [...subs].sort().forEach(s => {
    const o = document.createElement('option'); o.value = s; o.textContent = s; sSel.appendChild(o);
  });
  // Supertipi presenti nel database (es. Legendary, World) + "nessuno".
  const supers = new Set();
  for (const c of ALL) (c.supertipo || '').split(' ').forEach(s => { if (s) supers.add(s); });
  const spSel = el('fSuper');
  [...supers].sort().forEach(s => {
    const o = document.createElement('option');
    o.value = s; o.textContent = s + (SUPER_IT[s] ? ' (' + SUPER_IT[s] + ')' : '');
    spSel.appendChild(o);
  });
  const none = document.createElement('option');
  none.value = '-'; none.textContent = '(nessuno)';
  spSel.appendChild(none);
}

function buildSetFilter() {
  // Conta tutte le stampe di ogni set (ristampe e varianti comprese).
  const counts = new Map();
  for (const c of ALL) {
    for (const [set, lista] of c.stampe) counts.set(set, (counts.get(set) || 0) + lista.length);
  }
  // Ordine di uscita; i codici non in elenco vanno in fondo, in ordine alfabetico.
  const codes = [...counts.keys()].sort((a, b) => {
    const oa = SET_ORDER[a] ?? 9999, ob = SET_ORDER[b] ?? 9999;
    return oa !== ob ? oa - ob : a.localeCompare(b);
  });
  const sel = el('fSet');
  for (const code of codes) {
    const o = document.createElement('option');
    o.value = code;
    o.textContent = setLabel(code) + ' \u2014 ' + counts.get(code);
    sel.appendChild(o);
  }
}

/* ---------- Pannello filtri richiudibile ---------- */
const FILTERS_KEY = 'premodern-filtri-aperti';

function setFiltersOpen(open) {
  const panel = el('controls');
  panel.classList.toggle('collapsed', !open);
  panel.classList.remove('opening');
  if (open) { void panel.offsetWidth; panel.classList.add('opening'); }
  el('toggleFilters').setAttribute('aria-expanded', open ? 'true' : 'false');
  try { localStorage.setItem(FILTERS_KEY, open ? '1' : '0'); } catch { /* ignorato */ }
  paintFiltersBtn();
}

// Numero di filtri attivi, mostrato sul pulsante quando il pannello e' chiuso.
function activeFilterCount() {
  let n = 0;
  if (el('q').value.trim()) n++;
  ['fType', 'fSub', 'fRar', 'fSuper', 'fCmc', 'fSet', 'fLegal'].forEach(id => { if (el(id).value) n++; });
  if (colorFilter.size) n++;
  if (el('onlyFav').checked) n++;
  return n;
}

function paintFiltersBtn() {
  const open = !el('controls').classList.contains('collapsed');
  const n = activeFilterCount();
  const badge = n ? ' <span class="badge" aria-label="' + n + ' filtri attivi">' + n + '</span>' : '';
  el('toggleFilters').innerHTML = open ? 'Nascondi filtri &#9650;' : 'Filtri &#9660;' + badge;
}

function bindFiltersPanel() {
  el('toggleFilters').addEventListener('click', () =>
    setFiltersOpen(el('controls').classList.contains('collapsed')));
  el('closeFilters').addEventListener('click', () => {
    setFiltersOpen(false);
    window.scrollTo({ top: 0 });
  });
  let saved = null;
  try { saved = localStorage.getItem(FILTERS_KEY); } catch { /* ignorato */ }
  setFiltersOpen(saved !== '0');
  // Il pannello resta agganciato sotto l'intestazione, qualunque sia la sua altezza.
  const fixTop = () => { el('controls').style.top = document.querySelector('header').offsetHeight + 'px'; };
  fixTop();
  window.addEventListener('resize', fixTop);
}

function bindEvents() {
  ['q', 'scope', 'fType', 'fSub', 'fRar', 'fSuper', 'fCmc', 'fSet', 'fLegal', 'sortBy',
   'fLimit', 'colorMode'].forEach(id => el(id).addEventListener('input', render));
  el('showIt').addEventListener('change', render);
  el('onlyFav').addEventListener('change', render);
  el('reset').addEventListener('click', () => {
    el('q').value = ''; el('scope').value = 'all';
    el('fType').value = ''; el('fSub').value = ''; el('fRar').value = '';
    el('fSuper').value = ''; el('fCmc').value = ''; el('fLegal').value = '';
    el('onlyFav').checked = false;
    el('fSet').value = '';
    el('colorMode').value = 'any';
    colorFilter.clear();
    document.querySelectorAll('.cbtn').forEach(b => b.classList.remove('active'));
    render();
  });
  document.querySelectorAll('.cbtn').forEach(b => {
    b.addEventListener('click', () => {
      const c = b.dataset.c;
      if (colorFilter.has(c)) { colorFilter.delete(c); b.classList.remove('active'); }
      else { colorFilter.add(c); b.classList.add('active'); }
      render();
    });
  });
}

function matchesColor(card) {
  if (colorFilter.size === 0) return true;
  const cardColors = new Set((card.colori || '').split('').filter(Boolean));
  const mode = el('colorMode').value;
  const sel = colorFilter;
  const wantC = sel.has('C'); // incolore
  if (mode === 'any') {
    if (wantC && cardColors.size === 0) return true;
    for (const c of sel) { if (c !== 'C' && cardColors.has(c)) return true; }
    return false;
  }
  if (mode === 'exact') {
    const selColored = [...sel].filter(c => c !== 'C');
    if (wantC) {
      // deve essere incolore e nessun colore selezionato (oltre a C)
      return cardColors.size === 0 && selColored.length === 0;
    }
    if (cardColors.size !== selColored.length) return false;
    return selColored.every(c => cardColors.has(c));
  }
  if (mode === 'only') {
    // tutti i colori della carta devono stare nella selezione
    if (wantC && cardColors.size === 0) return true;
    for (const c of cardColors) { if (!sel.has(c)) return false; }
    return cardColors.size > 0 || wantC;
  }
  return true;
}

function esc(s) {
  return (s || '').replace(/[&<>"]/g, m => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[m]));
}
function highlight(text, q) {
  if (!q) return esc(text);
  const safe = esc(text);
  try {
    const re = new RegExp('(' + q.replace(/[.*+?^${}()|[\]\\]/g, '\\$&') + ')', 'gi');
    return safe.replace(re, '<mark>$1</mark>');
  } catch { return safe; }
}

// Ordine colori: W U B R G, poi multicolore, poi incolore.
function colorRank(c) {
  const cols = (c.colori || '').split('').filter(Boolean);
  if (cols.length === 0) return 6;
  if (cols.length > 1) return 5;
  return 'WUBRG'.indexOf(cols[0]);
}
function byName(a, b) { return (a.nome || '').localeCompare(b.nome || ''); }
function sortCards(list, how) {
  const cmp = {
    name: byName,
    cmc: (a, b) => (Number(a.cmc) || 0) - (Number(b.cmc) || 0) || byName(a, b),
    cmc_desc: (a, b) => (Number(b.cmc) || 0) - (Number(a.cmc) || 0) || byName(a, b),
    color: (a, b) => colorRank(a) - colorRank(b) || byName(a, b),
    rarity: (a, b) => (RARITY_RANK[a.rarita] ?? 9) - (RARITY_RANK[b.rarita] ?? 9) || byName(a, b),
    set: (a, b) => (SET_ORDER[a.set] ?? 9999) - (SET_ORDER[b.set] ?? 9999) ||
      String(a.stampa ? a.stampa.numero : '').localeCompare(String(b.stampa ? b.stampa.numero : ''), undefined, { numeric: true }) ||
      byName(a, b),
  }[how] || byName;
  list.sort(cmp);
}

function render() {
  const q = el('q').value.trim().toLowerCase();
  const scope = el('scope').value;
  const fType = el('fType').value;
  const fSub = el('fSub').value;
  const fRar = el('fRar').value;
  const fSet = el('fSet').value;
  const fSuper = el('fSuper').value;
  const fCmc = el('fCmc').value;
  const fLegal = el('fLegal').value;
  const onlyFav = el('onlyFav').checked;
  const sortBy = el('sortBy').value;
  const showIt = el('showIt').checked;

  // Senza set: una carta sola, con la sua stampa base.
  // Con un set: tutte le carte stampate in quel set, mostrate con la stampa di quel set
  // (immagine, link e rarita' di quella stampa).
  // Le varianti dello stesso set compaiono come carte separate.
  const src = fSet
    ? ALL.filter(c => c.stampe.has(fSet)).flatMap(c => {
        const lista = c.stampe.get(fSet);
        return lista.map(p => Object.assign({}, c, {
          set: p.set, rarita: p.rarita, rarita_it: RARITY_IT[p.rarita] || p.rarita,
          url_scryfall: p.url_scryfall, url_immagine: p.url_immagine,
          numero: lista.length > 1 ? p.numero : '',
          stampa: p,
        }));
      })
    : ALL;

  const out = src.filter(c => {
    if (fType && !((c.tipo || '').split(' ').includes(fType))) return false;
    if (fSub && !((c.sottotipo || '').split(' ').includes(fSub))) return false;
    if (fRar && c.rarita !== fRar) return false;
    if (fSuper) {
      const sup = (c.supertipo || '').split(' ').filter(Boolean);
      if (fSuper === '-' ? sup.length > 0 : !sup.includes(fSuper)) return false;
    }
    if (fCmc !== '') {
      const cmc = Math.floor(Number(c.cmc) || 0);
      if (fCmc === '7' ? cmc < 7 : cmc !== Number(fCmc)) return false;
    }
    if (fLegal === 'legal' && c.bandita) return false;
    if (fLegal === 'banned' && !c.bandita) return false;
    if (onlyFav && !FAV.has(c.nome)) return false;
    if (!matchesColor(c)) return false;
    if (q) {
      const inName = (c.nome || '').toLowerCase().includes(q) ||
                     (c.nome_it || '').toLowerCase().includes(q);
      const inText = (c.testo || '').toLowerCase().includes(q) ||
                     (c.testo_it || '').toLowerCase().includes(q);
      if (scope === 'name' && !inName) return false;
      if (scope === 'text' && !inText) return false;
      if (scope === 'all' && !inName && !inText) return false;
    }
    return true;
  });

  sortCards(out, sortBy);
  paintFiltersBtn();

  el('count').textContent = out.length + ' carte trovate (su ' + src.length +
    (fSet ? ' del set ' + setLabel(fSet) : '') + ')';

  const grid = el('grid');
  grid.innerHTML = '';
  const frag = document.createDocumentFragment();
  // limita il rendering per performance (200 / 600 / tutte); mostra avviso se troppi
  const limVal = el('fLimit').value;
  const LIMIT = limVal === 'all' ? Infinity : parseInt(limVal, 10);
  const slice = out.slice(0, LIMIT);
  for (const c of slice) {
    frag.appendChild(cardNode(c, q, showIt));
  }
  grid.appendChild(frag);
  if (out.length > LIMIT) {
    const more = document.createElement('div');
    more.className = 'count';
    more.style.gridColumn = '1 / -1';
    more.textContent = 'Mostrate le prime ' + LIMIT + '. Affina la ricerca per vederne altre.';
    grid.appendChild(more);
  }
}

function cardNode(c, q, showIt) {
  const div = document.createElement('div');
  div.className = 'card';
  div.tabIndex = 0;
  div.setAttribute('role', 'button');
  div.setAttribute('aria-label', 'Apri ' + c.nome);
  div.addEventListener('click', () => openModal(c));
  div.addEventListener('keydown', e => {
    if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); openModal(c); }
  });

  // Stella preferiti (non apre la finestra).
  const star = document.createElement('button');
  star.className = 'fav';
  const paintStar = () => {
    const on = FAV.has(c.nome);
    star.classList.toggle('on', on);
    star.textContent = on ? '\u2605' : '\u2606';
    star.setAttribute('aria-pressed', on ? 'true' : 'false');
    star.setAttribute('aria-label', on ? 'Togli dai preferiti' : 'Aggiungi ai preferiti');
    star.title = star.getAttribute('aria-label');
  };
  paintStar();
  star.addEventListener('click', e => {
    e.stopPropagation();
    toggleFav(c.nome);
    if (el('onlyFav').checked) render(); else paintStar();
  });
  star.addEventListener('keydown', e => e.stopPropagation());
  div.appendChild(star);

  const imgwrap = document.createElement('div');
  imgwrap.className = 'imgwrap';
  if (c.url_immagine) {
    const img = document.createElement('img');
    img.loading = 'lazy';
    img.src = c.url_immagine;
    img.alt = c.nome;
    img.onerror = () => { imgwrap.innerHTML = '<div class="noimg">' + esc(c.nome) + '</div>'; };
    imgwrap.appendChild(img);
  } else {
    imgwrap.innerHTML = '<div class="noimg">' + esc(c.nome) + '</div>';
  }
  div.appendChild(imgwrap);

  const body = document.createElement('div');
  body.className = 'body';

  const nm = document.createElement('div');
  nm.className = 'nm';
  nm.innerHTML = highlight(c.nome, q);
  body.appendChild(nm);

  if (showIt && c.nome_it) {
    const nmit = document.createElement('div');
    nmit.className = 'nm_it';
    nmit.innerHTML = highlight(c.nome_it, q);
    body.appendChild(nmit);
  }

  const meta = document.createElement('div');
  meta.className = 'meta';
  const mana = c.costo_mana ? '<span class="mana">' + esc(c.costo_mana) + '</span>' : '';
  const rar = c.rarita ? ' <span class="pill ' + c.rarita + '">' + esc(c.rarita_it || c.rarita) + '</span>' : '';
  // Con le varianti mostra anche il numero di collezione (es. "FEM #31a").
  const setTxt = c.set ? c.set.toUpperCase() + (c.numero ? ' #' + c.numero : '') : '';
  const set = c.set ? ' <span class="pill" title="' + esc(SET_NAME[c.set] || c.set) + '">' + esc(setTxt) + '</span>' : '';
  const ban = c.bandita ? ' <span class="pill banned" title="Bandita in Premodern">Bandita</span>' : '';
  meta.innerHTML = mana + rar + set + ban;
  body.appendChild(meta);

  const tl = document.createElement('div');
  tl.className = 'typeline';
  let ptStr = '';
  if (c.forza !== '' || c.costituzione !== '') {
    ptStr = ' <span class="pt">' + esc(c.forza) + '/' + esc(c.costituzione) + '</span>';
  }
  tl.innerHTML = esc(c.type_line) + ptStr;
  body.appendChild(tl);

  if (c.testo) {
    const rules = document.createElement('div');
    rules.className = 'rules';
    rules.innerHTML = highlight(c.testo, q);
    body.appendChild(rules);
  }

  if (showIt && c.testo_it) {
    const rit = document.createElement('div');
    rit.className = 'rules_it';
    rit.innerHTML = highlight(c.testo_it, q);
    body.appendChild(rit);
  }

  if (c.url_scryfall) {
    const a = document.createElement('a');
    a.className = 'srclink';
    a.href = c.url_scryfall; a.target = '_blank'; a.rel = 'noopener';
    a.textContent = 'Scryfall \u2197';
    a.addEventListener('click', e => e.stopPropagation());
    body.appendChild(a);
  }

  div.appendChild(body);
  return div;
}

/* ---------- Vista ingrandita + prezzi ---------- */

let modalCard = null;     // carta aperta
let modalPrint = null;    // stampa mostrata
let lastFocus = null;     // elemento da rifocalizzare alla chiusura
const PRICE_CACHE = new Map(); // "set/numero" -> dati prezzo (per la sessione)

function bindModal() {
  el('mClose').addEventListener('click', closeModal);
  el('modalBg').addEventListener('click', e => { if (e.target === el('modalBg')) closeModal(); });
  document.addEventListener('keydown', e => {
    if (e.key === 'Escape' && el('modalBg').classList.contains('open')) closeModal();
  });
  el('mFav').addEventListener('click', () => {
    if (!modalCard) return;
    toggleFav(modalCard.nome);
    paintModalFav();
    render();
  });
}

function paintModalFav() {
  const on = FAV.has(modalCard.nome);
  el('mFav').textContent = on ? '\u2605 Nei preferiti' : '\u2606 Aggiungi ai preferiti';
  el('mFav').setAttribute('aria-pressed', on ? 'true' : 'false');
}

function largeImg(url) { return (url || '').replace('/normal/', '/large/'); }

function printLabel(p, multi) {
  return p.set.toUpperCase() + (multi && p.numero ? ' #' + p.numero : '');
}

function openModal(c) {
  // c puo' essere una "vista" di una stampa: si risale alla carta originale.
  const base = ALL.find(x => x.nome === c.nome) || c;
  modalCard = base;
  lastFocus = document.activeElement;
  const showIt = el('showIt').checked;

  el('mName').textContent = base.nome;
  el('mNameIt').textContent = showIt && base.nome_it ? base.nome_it : '';
  let pt = '';
  if (base.forza !== '' || base.costituzione !== '') pt = '  ' + base.forza + '/' + base.costituzione;
  el('mType').textContent = (base.type_line || '') + pt;
  el('mText').textContent = base.testo || '';
  el('mTextIt').textContent = showIt && base.testo_it && base.testo_it !== base.testo ? base.testo_it : '';
  el('mTextIt').style.display = el('mTextIt').textContent ? '' : 'none';

  // Elenco di tutte le stampe, in ordine di uscita.
  const all = [];
  for (const lista of base.stampe.values()) for (const p of lista) all.push(p);
  all.sort((a, b) => (SET_ORDER[a.set] ?? 9999) - (SET_ORDER[b.set] ?? 9999) ||
    String(a.numero).localeCompare(String(b.numero), undefined, { numeric: true }));
  const nSet = base.stampe.size;
  el('mPrintsTitle').textContent = 'Stampe (' + all.length + ' in ' + nSet + (nSet === 1 ? ' set)' : ' set)');
  const box = el('mPrints');
  box.innerHTML = '';
  for (const p of all) {
    const b = document.createElement('button');
    const multi = (base.stampe.get(p.set) || []).length > 1;
    b.textContent = printLabel(p, multi);
    b.title = (SET_NAME[p.set] || p.set) + (RARITY_IT[p.rarita] ? ' \u2014 ' + RARITY_IT[p.rarita] : '');
    b.addEventListener('click', () => showPrint(p));
    p._btn = b;
    box.appendChild(b);
  }

  paintModalFav();
  showPrint(c.stampa || base.stampa || all[0]);

  el('modalBg').classList.add('open');
  document.body.classList.add('noscroll');
  el('mClose').focus();
}

function showPrint(p) {
  if (!p) return;
  modalPrint = p;
  const base = modalCard;
  el('mImg').src = largeImg(p.url_immagine);
  el('mImg').alt = base.nome + ' (' + (SET_NAME[p.set] || p.set) + ')';
  const multi = (base.stampe.get(p.set) || []).length > 1;
  const mana = base.costo_mana ? '<span class="mana">' + esc(base.costo_mana) + '</span> ' : '';
  el('mMeta').innerHTML = mana +
    '<span class="pill ' + esc(p.rarita) + '">' + esc(RARITY_IT[p.rarita] || p.rarita) + '</span> ' +
    '<span class="pill">' + esc(setLabel(p.set)) + (multi && p.numero ? ' #' + esc(p.numero) : '') + '</span>' +
    (base.bandita ? ' <span class="pill banned">Bandita in Premodern</span>' : '');
  el('mScry').href = p.url_scryfall || base.url_scryfall;
  for (const lista of base.stampe.values()) for (const x of lista) {
    if (x._btn) x._btn.classList.toggle('cur', x === p);
  }
  loadPrice(p);
}

function fmtEur(v) {
  return v == null ? '\u2014' : Number(v).toLocaleString('it-IT', { style: 'currency', currency: 'EUR' });
}
function fmtUsd(v) {
  return v == null ? '\u2014' : Number(v).toLocaleString('it-IT', { style: 'currency', currency: 'USD' });
}

async function loadPrice(p) {
  const box = el('mPrice');
  const cm = el('mCm');
  cm.style.display = 'none';
  if (!p.numero) { box.innerHTML = 'Prezzo non disponibile per questa stampa.'; return; }
  const key = p.set + '/' + p.numero;
  box.innerHTML = 'Caricamento prezzo\u2026';
  try {
    let d = PRICE_CACHE.get(key);
    if (!d) {
      const res = await fetch('https://api.scryfall.com/cards/' + encodeURIComponent(p.set) + '/' +
        encodeURIComponent(p.numero), { headers: { Accept: 'application/json' } });
      if (!res.ok) throw new Error('HTTP ' + res.status);
      const j = await res.json();
      d = { prices: j.prices || {}, cardmarket: (j.purchase_uris || {}).cardmarket || '' };
      PRICE_CACHE.set(key, d);
    }
    if (modalPrint !== p) return; // nel frattempo e' stata scelta un'altra stampa
    const pr = d.prices;
    box.innerHTML =
      'Cardmarket (EUR): <b>' + fmtEur(pr.eur) + '</b>' + (pr.eur_foil ? ' &middot; foil ' + fmtEur(pr.eur_foil) : '') + '<br>' +
      'TCGplayer (USD): <b>' + fmtUsd(pr.usd) + '</b>' + (pr.usd_foil ? ' &middot; foil ' + fmtUsd(pr.usd_foil) : '') + '<br>' +
      '<span class="note">Fonte: Scryfall, prezzi medi aggiornati circa una volta al giorno. "\u2014" = nessun dato.</span>';
    if (d.cardmarket) { cm.href = d.cardmarket; cm.style.display = ''; }
  } catch (e) {
    if (modalPrint !== p) return;
    box.innerHTML = 'Prezzo non disponibile (serve la connessione a internet).';
  }
}

function closeModal() {
  el('modalBg').classList.remove('open');
  document.body.classList.remove('noscroll');
  el('mImg').removeAttribute('src');
  modalCard = null; modalPrint = null;
  if (lastFocus && lastFocus.focus) lastFocus.focus();
}

load();

// Registrazione del service worker per il funzionamento offline (PWA).
if ('serviceWorker' in navigator) {
  window.addEventListener('load', () => {
    navigator.serviceWorker.register('sw.js').catch(() => { /* silenzioso */ });
  });
}
